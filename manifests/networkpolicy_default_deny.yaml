# Default-deny NetworkPolicy for all pods in the namespace
#
# This policy establishes the baseline security posture by denying all ingress and egress
# traffic by default. Specific allow policies (additive model) then permit required traffic.
#
# NetworkPolicy Semantics:
# - No Policy == Allow All: Without any NetworkPolicy, all traffic is allowed
# - Any Policy == Default Deny: Once a pod is selected by any policy, unspecified traffic is denied
# - Additive Model: Multiple policies selecting the same pod create an effective union of allowed traffic
#
# This policy is named with "04_04" prefix to ensure it's applied after allow policies (01, 02, 03)
# preventing race conditions where default-deny might be applied before allow rules exist.
#
# Compliance: Aligns with CIS Kubernetes Benchmark 5.3.2
# "Ensure that all Namespaces have Network Policies defined"
#
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: run-once-duration-override-default-deny
  namespace: openshift-run-once-duration-override-operator
spec:
  podSelector: {}  # Matches all pods in namespace
  policyTypes:
    - Ingress    # Deny all ingress (no rules specified)
    - Egress     # Deny all egress (no rules specified)
