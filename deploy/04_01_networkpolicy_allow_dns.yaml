# Allow DNS egress for all pods in the namespace
# Required for DNS name resolution
# Follows CIS benchmark 5.3.2 and network policy best practices
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: run-once-duration-override-allow-dns
  namespace: openshift-run-once-duration-override-operator
spec:
  podSelector: {}  # Matches all pods in namespace
  policyTypes:
    - Egress
  egress:
    # Allow DNS queries to openshift-dns namespace
    # Both TCP and UDP on port 5353 (OpenShift DNS configuration)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
