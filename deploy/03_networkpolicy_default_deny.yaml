# Default-deny NetworkPolicy for the operator namespace.
#
# This policy selects all pods in the namespace and enables default-deny
# for both ingress and egress by specifying policyTypes without any allow rules.
#
# NetworkPolicies are additive (use OR logic):
# - This policy enables default-deny for all pods
# - Subsequent policies add specific allow rules
# - If any policy allows traffic, that traffic is permitted
# - Policies cannot override or block traffic allowed by other policies
#
# Note: The run-once-duration-override DaemonSet uses hostNetwork=true and
# automatically bypasses all NetworkPolicy rules. This policy only affects
# future pods that run on the pod network (if any are added, such as helper
# pods similar to kube-apiserver-operator's guard/installer/pruner pods).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: openshift-run-once-duration-override-operator
  annotations:
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
