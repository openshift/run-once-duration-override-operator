# Note: The run-once-duration-override DaemonSet uses hostNetwork=true and
# automatically bypasses all NetworkPolicy rules.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: openshift-run-once-duration-override-operator
  annotations:
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
spec:
  podSelector:
    matchLabels:
      runoncedurationoverride: "true"
  policyTypes:
  - Ingress
  - Egress
